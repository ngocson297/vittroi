services:
  postgres:
    image: postgres:17-alpine
    container_name: vit-troi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vit_troi
      POSTGRES_USER: vit_troi
      POSTGRES_PASSWORD: vit_troi_local
    ports:
      - '5433:5432'
    volumes:
      - vit_troi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  vit_troi_postgres_data:
